name: Cross-platform tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Test
        run: python -m pytest -q
      - name: Install face models
        run: python scripts/install_models.py
      - name: Model and inference smoke test
        run: python scripts/smoke_face_engine.py
      - name: Application smoke test
        run: python -c "from app.main import app; from app.services.diagnostics import system_diagnostics; d=system_diagnostics(); print(app.title, app.version, d); assert d['ready']"

  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[packaging]
      - name: Install face models
        run: python scripts/install_models.py
      - name: Build desktop application
        run: python scripts/build_desktop.py
      - name: Smoke test packaged application
        run: python scripts/smoke_packaged_app.py
      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: python scripts/build_macos_dmg.py
      - name: Validate and smoke test macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          DMG="dist/Auroara-Face-Photo-Finder-0.7.0.dmg"
          test -s "$DMG"
          hdiutil verify "$DMG"
          MOUNT="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -force || true; rmdir "$MOUNT" || true' EXIT
          test -d "$MOUNT/Auroara Face Photo Finder.app"
          python scripts/smoke_packaged_app.py --executable "$MOUNT/Auroara Face Photo Finder.app/Contents/MacOS/Auroara Face Photo Finder"
          hdiutil detach "$MOUNT"
          trap - EXIT
          rmdir "$MOUNT"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc 'packaging\windows\AuroaraFacePhotoFinder.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Resolve-Path 'dist\installer\Auroara-Face-Photo-Finder-0.7.0-Setup.exe').Path
          if ((Get-Item $installer).Length -le 0) { throw 'Installer is empty' }
          $installDir = Join-Path $env:RUNNER_TEMP 'AuroaraFacePhotoFinderInstalled'
          & $installer /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR="$installDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $installDir 'Auroara Face Photo Finder.exe'
          if (-not (Test-Path $exe)) { throw "Installed executable not found: $exe" }
          python scripts/smoke_packaged_app.py --executable "$exe"
          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller not found: $uninstaller" }
          & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Sleep -Seconds 2
          if (Test-Path $exe) { throw 'Installed executable remained after uninstall' }
