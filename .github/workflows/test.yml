name: Cross-platform tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Test
        run: python -m pytest -q
      - name: Install face models
        run: python scripts/install_models.py
      - name: Model and inference smoke test
        run: python scripts/smoke_face_engine.py
      - name: Application smoke test
        run: python -c "from app.main import app; from app.services.diagnostics import system_diagnostics; d=system_diagnostics(); print(app.title, app.version, d); assert d['ready']"

  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[packaging]
      - name: Install face models
        run: python scripts/install_models.py
      - name: Build desktop application
        run: python scripts/build_desktop.py
      - name: Smoke test packaged application
        run: python scripts/smoke_packaged_app.py
      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: python scripts/build_macos_dmg.py
      - name: Validate macOS DMG
        if: runner.os == 'macOS'
        run: |
          test -s "dist/Auroara-Face-Photo-Finder-0.7.0.dmg"
          hdiutil verify "dist/Auroara-Face-Photo-Finder-0.7.0.dmg"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc 'packaging\windows\AuroaraFacePhotoFinder.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = 'dist\installer\Auroara-Face-Photo-Finder-0.7.0-Setup.exe'
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          if ((Get-Item $installer).Length -le 0) { throw 'Installer is empty' }
