[project]
name = "face-photo-finder"
version = "0.7.0"
description = "Local-first mixed-storage photo indexing and face search application"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.6,<3",
  "google-api-python-client>=2.150,<3",
  "google-auth>=2.35,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-auth-httplib2>=0.2,<1",
  "pillow>=11,<13",
  "pillow-heif>=0.20,<2",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "scikit-learn>=1.5,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=43,<47"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
packaging = ["pyinstaller>=6.11,<7"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
